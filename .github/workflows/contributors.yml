name: Auto Update Contributors

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-contributors:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contributors & update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const { data: contributors } = await github.rest.repos.listContributors({
              owner: repo.owner,
              repo: repo.repo,
              per_page: 100,
            });

            // Excluir bots e IA
            const humanContributors = contributors.filter(
              c => c.type === 'User' && !c.login.includes('[bot]') && c.login.toLowerCase() !== 'claude'
            );

            // Generar avatares pequeños enlazados al perfil individual
            const html = humanContributors
              .map(
                c => `<a href="${c.html_url}" title="${c.login}">\n  <img src="${c.avatar_url}" width="48" height="48" style="border-radius:50%" alt="${c.login}" />\n</a>`
              )
              .join('\n');

            let readme = fs.readFileSync('README.md', 'utf8');
            const startTag = '<!-- CONTRIBUTORS-START -->';
            const endTag = '<!-- CONTRIBUTORS-END -->';

            if (readme.includes(startTag) && readme.includes(endTag)) {
              const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`, 'm');
              readme = readme.replace(regex, `${startTag}\n${html}\n${endTag}`);
              fs.writeFileSync('README.md', readme, 'utf8');
            }

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto update contributors in README [skip ci]"
            git push
          fi

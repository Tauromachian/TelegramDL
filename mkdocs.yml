site_name: TelegramDL
site_url: https://infinityxgame.github.io/TelegramDL/
site_description: Gestor de descargas de Telegram de alto rendimiento para escritorio (Go + Wails + Vue).
site_author: infinityxgame
repo_url: https://github.com/infinityxgame/TelegramDL
repo_name: infinityxgame/TelegramDL

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro / Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro / Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/custom.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Inicio: Home
            Primeros Pasos: Getting Started
            Funcionalidades: Features
            Modo Escucha: Listener Mode
            Acceso Remoto: Remote Access
            Referencia API: API Reference
            Arquitectura: Architecture
            Línea de Comandos: CLI & Modes

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

nav:
  - Inicio: index.md
  - Primeros Pasos: getting-started.md
  - Funcionalidades: features.md
  - Modo Escucha: listener.md
  - Acceso Remoto: remote-access.md
  - Referencia API: api-reference.md
  - Arquitectura: architecture.md
  - Línea de Comandos: cli.md
